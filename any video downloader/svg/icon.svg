<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <!-- Emerald Shutter Blade Gradient -->
    <linearGradient id="shutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Dark Steel Inner Blade Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Film Reel Outer Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#10b981" stroke-width="12" stroke-opacity="0.9" />
  <circle cx="256" cy="256" r="158" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />

  <!-- 6 Cinematic Aperture / Shutter Blades -->
  <g transform="translate(256, 256)">
    <!-- Blade 1 -->
    <path d="M0 -150 L110 -90 L40 -30 Z" fill="url(#shutterGrad)" transform="rotate(0)" />
    <!-- Blade 2 -->
    <path d="M0 -150 L110 -90 L40 -30 Z" fill="url(#shutterGrad)" transform="rotate(60)" />
    <!-- Blade 3 -->
    <path d="M0 -150 L110 -90 L40 -30 Z" fill="url(#shutterGrad)" transform="rotate(120)" />
    <!-- Blade 4 -->
    <path d="M0 -150 L110 -90 L40 -30 Z" fill="url(#shutterGrad)" transform="rotate(180)" />
    <!-- Blade 5 -->
    <path d="M0 -150 L110 -90 L40 -30 Z" fill="url(#shutterGrad)" transform="rotate(240)" />
    <!-- Blade 6 -->
    <path d="M0 -150 L110 -90 L40 -30 Z" fill="url(#shutterGrad)" transform="rotate(300)" />

    <!-- Center Lens Core -->
    <circle cx="0" cy="0" r="48" fill="url(#steelGrad)" stroke="#10b981" stroke-width="4" />
    <circle cx="0" cy="0" r="22" fill="#10b981" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>
