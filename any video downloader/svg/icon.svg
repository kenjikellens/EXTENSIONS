<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Emerald Shutter Blade Gradient -->
    <linearGradient id="shutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Dark Steel Inner Disc Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Outer Film Reel Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#10b981" stroke-width="16" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- 6 Cinematic Aperture / Shutter Blades -->
  <g transform="translate(256, 256)">
    <!-- Blade 1 -->
    <path d="M0 -200 L146 -120 L53 -40 Z" fill="url(#shutterGrad)" transform="rotate(0)" />
    <!-- Blade 2 -->
    <path d="M0 -200 L146 -120 L53 -40 Z" fill="url(#shutterGrad)" transform="rotate(60)" />
    <!-- Blade 3 -->
    <path d="M0 -200 L146 -120 L53 -40 Z" fill="url(#shutterGrad)" transform="rotate(120)" />
    <!-- Blade 4 -->
    <path d="M0 -200 L146 -120 L53 -40 Z" fill="url(#shutterGrad)" transform="rotate(180)" />
    <!-- Blade 5 -->
    <path d="M0 -200 L146 -120 L53 -40 Z" fill="url(#shutterGrad)" transform="rotate(240)" />
    <!-- Blade 6 -->
    <path d="M0 -200 L146 -120 L53 -40 Z" fill="url(#shutterGrad)" transform="rotate(300)" />

    <!-- Center Lens Disc -->
    <circle cx="0" cy="0" r="68" fill="url(#steelGrad)" stroke="#10b981" stroke-width="5" />

    <!-- Pure Emerald Green Play Button -->
    <path d="M-15 -30 C-15 -34 -10 -36 -6 -34 L30 -5 C34 -3 34 3 30 5 L-6 34 C-10 36 -15 34 -15 30 Z" fill="#10b981" />
  </g>
</svg>
